name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four jobs side by side: the run takes as long as the slowest one, not all of them added up.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: jobagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jobagent:jobagent@127.0.0.1:5432/jobagent_test
    steps:
      # A throwaway database: skip the disk flushes that make every commit wait.
      - name: Tune Postgres for tests
        run: |
          PGPASSWORD=jobagent psql -h 127.0.0.1 -U jobagent -d jobagent_test \
            -c "alter system set fsync = off" \
            -c "alter system set synchronous_commit = off" \
            -c "alter system set full_page_writes = off" \
            -c "select pg_reload_conf()"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The PDF and form tests print with Chromium, as Pen does. The browser is cached per Playwright
      # version; its system libraries come from apt either way.
      - id: playwright
        run: echo "version=$(pnpm --filter @jobagent/agents exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @jobagent/agents exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @jobagent/agents exec playwright install-deps chromium
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    env:
      # Read when a request comes in, never during the build; set only so config checks pass.
      DATABASE_URL: postgres://jobagent:jobagent@127.0.0.1:5432/jobagent_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @jobagent/web build
